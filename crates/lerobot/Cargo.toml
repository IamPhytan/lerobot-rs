[package]
name = "lerobot"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
glob = "0.3.3"
polars = { version = "0.52.0", features = ["parquet", "lazy", "timezones"] }
rerun = { version = "0.29.0", features = ["web_viewer"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[features]
default = []
viz = ["rerun"]
