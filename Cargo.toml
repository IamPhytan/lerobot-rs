[package]
name = "lerobot"
version = "0.1.0"
edition = "2024"
authors = ["Damien LaRocque <phicoltan@gmail.com>"]
repository = "https://github.com:IamPhytan/lerobot-rs"
license = "MIT OR Apache-2.0"

[dependencies]
tqdm = { version = "0.8.0", optional = true }
clap = { version = "4.5.56", features = ["derive"] }
ffmpeg-next = "8.1.0"
glob = "0.3.3"
polars = { version = "0.52.0", features = [
    "parquet",
    "lazy",
    "timezones",
    "dtype-array",
    "is_in",
] }
rerun = { version = "0.34.0", features = ["web_viewer"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
ndarray = "0.17.2"
anyhow = { version = "1.0.103", optional = true }
num-traits = { version = "0.2.19", optional = true }

[features]
default = []
viz = ["rerun", "tqdm", "anyhow", "num-traits"]
